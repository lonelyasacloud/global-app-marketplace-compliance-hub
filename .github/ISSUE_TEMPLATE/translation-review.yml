name: Translation review
description: Review or report a mismatch between the English and Simplified Chinese pages.
title: "[Translation] "
labels:
  - translation
body:
  - type: input
    id: topic_id
    attributes:
      label: Stable topic ID
      placeholder: google-play.data-safety.baseline
    validations:
      required: true
  - type: input
    id: english_page
    attributes:
      label: English page
      placeholder: docs/.../topic.en-US.md
    validations:
      required: true
  - type: input
    id: chinese_page
    attributes:
      label: Simplified Chinese page
      placeholder: docs/.../topic.zh-CN.md
    validations:
      required: true
  - type: textarea
    id: mismatch
    attributes:
      label: Mismatch or missing context
      description: Include the exact heading or paragraph and explain whether it changes scope, date, obligation, or evidence level.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Review checks
      options:
        - label: I checked the official source before reporting this issue.
          required: true
        - label: I preserved future-dated and partial-coverage notes.
          required: true
