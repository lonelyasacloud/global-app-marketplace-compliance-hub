site_name: Global App Marketplace Compliance Hub
site_description: Bilingual, source-backed compliance knowledge base for Apple App Store and Google Play.
site_url: https://lonelyasacloud.github.io/global-app-marketplace-compliance-hub/
repo_name: lonelyasacloud/global-app-marketplace-compliance-hub
repo_url: https://github.com/lonelyasacloud/global-app-marketplace-compliance-hub
edit_uri: edit/main/docs/

docs_dir: docs
strict: true
use_directory_urls: true

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra:
  generator: false
  support_url: https://github.com/lonelyasacloud/global-app-marketplace-compliance-hub/issues
